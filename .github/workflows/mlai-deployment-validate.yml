name: Validate MLAI Plane deployment

on:
  pull_request:
    paths:
      - "deploy/mlai/**"
      - ".github/workflows/mlai-*.yml"
      - "apps/api/plane/utils/cloudflare_email.py"
      - "apps/api/plane/license/utils/instance_value.py"
      - "apps/api/plane/license/api/views/instance.py"
      - "apps/api/plane/settings/common.py"
      - "apps/api/plane/db/management/commands/test_email.py"
  push:
    branches: [main]
    paths:
      - "deploy/mlai/**"
      - ".github/workflows/mlai-*.yml"
      - "apps/api/plane/utils/cloudflare_email.py"
      - "apps/api/plane/license/utils/instance_value.py"
      - "apps/api/plane/license/api/views/instance.py"
      - "apps/api/plane/settings/common.py"
      - "apps/api/plane/db/management/commands/test_email.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test Cloudflare email without a database or network
        run: |
          python -m pip install Django==5.2.15 requests==2.33.0
          python deploy/mlai/test-cloudflare-email.py
          python deploy/mlai/test-email-deployment.py
      - name: Validate scripts
        run: bash -n deploy/mlai/run.sh
      - name: Validate staging SSH tunnel configuration
        run: python3 deploy/mlai/test-ssh-tunnel.py
      - name: Validate read-only migration identity lookup
        run: python3 deploy/mlai/test-migration-identity.py
      - name: Validate migration isolation and secret templates
        run: |
          grep -Fq 'profiles: [migration]' deploy/mlai/compose.yml
          grep -Fq 'PLANE_MIGRATION_APPROVAL' deploy/mlai/run.sh
          python3 deploy/mlai/validate-secret-templates.py
      - name: Parse Compose configuration
        run: docker compose --env-file deploy/mlai/.env.example -f deploy/mlai/compose.yml config --quiet
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
      - name: Validate Terraform
        run: |
          terraform -chdir=deploy/mlai/terraform fmt -check -diff
          terraform -chdir=deploy/mlai/terraform init -backend=false -input=false
          terraform -chdir=deploy/mlai/terraform validate
          terraform -chdir=deploy/mlai/terraform test
